name: PHP syntax check

on:
  push:
    branches: [main]
    paths:
      - '**.php'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/php-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: Check PHP syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint plugin PHP files
        run: |
          set -e
          find . -type f -name '*.php' -not -path './.git/*' -print0 |
            while IFS= read -r -d '' file; do
              php -l "$file"
            done

      - name: Run brand aggregation regression tests
        run: php tests/test-brand-aggregation.php

  wordpress-integration:
    name: WordPress integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start WordPress and WooCommerce
        run: npx --yes @wordpress/env start

      - name: Run brand aggregation integration tests
        run: npx --yes @wordpress/env run tests-cli wp eval-file wp-content/plugins/woo-category-brand-manager/tests/integration/test-brand-aggregation.php

      - name: Stop WordPress environment
        if: always()
        run: npx --yes @wordpress/env stop
